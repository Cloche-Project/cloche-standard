name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: 
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"

  pull_request:
    branches:
      - main
      - beta
    paths-ignore: 
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"

  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - standard-gnome.yml
          - standard-plasma.yml
          #- deck.yml
          #- deck-gnome.yml
          #- cloche-xe.yml
          #- cloche-xe-gnome.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          #tags: latest, main
          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

      - name: Resolve published image reference
        run: |
          NAME=$(yq -r '.name' "recipes/${{ matrix.recipe }}")
          if [[ ! "$NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Unexpected recipe name: $NAME" >&2
            exit 1
          fi
          echo "IMAGE_TAG=ghcr.io/cloche-project/${NAME}:latest" >> "$GITHUB_ENV"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0' # report-only for now; flip to '1' once noise is triaged (Fase 3)
          severity: 'CRITICAL,HIGH'

      - name: Scan image with Grype
        uses: anchore/scan-action@8576240a41341d866dbd7ebc72cd9fc0ef023f54 # v7.4.2
        continue-on-error: true
        with:
          image: ${{ env.IMAGE_TAG }}
          fail-build: false # report-only, same reasoning as above
          severity-cutoff: high
