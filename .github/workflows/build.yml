name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: 
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"

  pull_request:
    branches:
      - main
      - beta
    paths-ignore: 
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"

  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - standard-gnome.yml
          - standard-plasma.yml
          #- deck.yml
          #- deck-gnome.yml
          #- cloche-xe.yml
          #- cloche-xe-gnome.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          #tags: latest, main
          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  scan:
    name: Scan Image
    needs: bluebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - standard-gnome.yml
          - standard-plasma.yml
          #- deck.yml
          #- deck-gnome.yml
          #- cloche-xe.yml
          #- cloche-xe-gnome.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve published image reference
        run: |
          NAME=$(yq -r '.name' "recipes/${{ matrix.recipe }}")
          if [[ ! "$NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Unexpected recipe name: $NAME" >&2
            exit 1
          fi
          echo "IMAGE_TAG=ghcr.io/cloche-project/${NAME}:latest" >> "$GITHUB_ENV"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        timeout-minutes: 15
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0' # report-only for now; flip to '1' once noise is triaged (Fase 3)
          severity: 'CRITICAL,HIGH'

      # Grype (via syft/stereoscope) reliably OOMs analyzing rpm-ostree/OSTree
      # image filesystems - known upstream issue, not specific to this repo
      # (see anchore/syft#3800). Not run here; Trivy covers this image alone.
